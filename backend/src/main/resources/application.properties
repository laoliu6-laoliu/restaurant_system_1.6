server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resjk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.web.resources.add-mappings=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=always
app.demo-payments-enabled=${DEMO_PAYMENTS_ENABLED:true}
app.upgrade-enabled=true
app.reservation-expiry-interval-ms=${RESERVATION_EXPIRY_INTERVAL_MS:60000}
app.reservation-expiry-initial-delay-ms=${RESERVATION_EXPIRY_INITIAL_DELAY_MS:60000}
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.open-in-view=false
